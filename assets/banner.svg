<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1226" height="460" viewBox="0 0 613 230" role="img"
     aria-labelledby="title desc">
  <title id="title">Bottega Stack banner</title>
  <desc id="desc">A minimalist Italian bottega storefront emblem beside the Bottega Stack wordmark and tagline.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#482512"/>
      <stop offset=".52" stop-color="#351b0f"/>
      <stop offset="1" stop-color="#24130c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e7b9"/>
      <stop offset="1" stop-color="#eacb86"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cf76"/>
      <stop offset="1" stop-color="#d99531"/>
    </linearGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r=".55" fill="#f2d7a0" opacity=".15"/>
      <circle cx="21" cy="18" r=".45" fill="#f2d7a0" opacity=".12"/>
      <path d="M10 29l4-1" stroke="#f2d7a0" stroke-width=".4" opacity=".10"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Storefront emblem -->
  <g transform="translate(39 32)">
    <!-- Arch -->
    <path d="M20 137V82a75 75 0 0 1 150 0v55" fill="none"
          stroke="#f4d99d" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M20 137H180" stroke="#f4d99d" stroke-width="1.6"/>

    <!-- Shop facade -->
    <path d="M39 136V70h112v66Z" fill="url(#wall)" stroke="#d8b36e" stroke-width=".8"/>
    <path d="M39 70h112" stroke="#f8e8c0" stroke-width="1.2"/>

    <!-- Door -->
    <rect x="60" y="88" width="29" height="48" fill="#4a2a17"/>
    <rect x="63" y="91" width="23" height="45" fill="#5a321b"/>
    <circle cx="83" cy="113" r="1.5" fill="#e5ad45"/>

    <!-- Window -->
    <rect x="103" y="84" width="35" height="30" fill="#3b3023"/>
    <rect x="105" y="86" width="31" height="26" fill="#302a20"/>
    <path d="M120.5 86v26M105 99h31" stroke="#e8c987" stroke-width="2.1"/>
    <path d="M101 116h39" stroke="#b17a39" stroke-width="2"/>

    <!-- Awning top -->
    <path d="M45 44h101l12 22H34Z" fill="#b83e20"/>
    <path d="M45 44h15l-6 22H34Z" fill="#e8d29e"/>
    <path d="M60 44h15l-3 22H54Z" fill="#c94c2d"/>
    <path d="M75 44h15l3 22H72Z" fill="#f0dfb7"/>
    <path d="M90 44h15l8 22H93Z" fill="#c84b2b"/>
    <path d="M105 44h15l11 22h-18Z" fill="#f1dfb5"/>
    <path d="M120 44h15l11 22h-15Z" fill="#c84b2b"/>

    <!-- Scalloped awning hem -->
    <path d="M34 66h124
      c0 7-4 10-9 10s-8-3-8-8
      c0 5-4 8-9 8s-8-3-8-8
      c0 5-4 8-9 8s-8-3-8-8
      c0 5-4 8-9 8s-8-3-8-8
      c0 5-4 8-9 8s-8-3-8-8
      c0 5-4 8-9 8s-8-3-8-8
      c0 5-4 8-9 8s-8-3-8-8Z"
      fill="#b83e20" stroke="#8e301b" stroke-width=".8"/>
    <path d="M49 68c0 5 3 8 7 8s7-3 7-8M78 68c0 5 3 8 7 8s7-3 7-8M107 68c0 5 3 8 7 8s7-3 7-8M136 68c0 5 3 8 7 8s7-3 7-8"
      fill="none" stroke="#f1dfb5" stroke-width="1.1" opacity=".9"/>

    <!-- Small potted plant -->
    <g transform="translate(13 95)">
      <path d="M9 30V11M9 20C1 19 0 13 2 10c6 0 9 4 7 10M9 15c-1-7 3-11 8-12 2 6-1 11-8 12M8 24c-6-1-8-5-7-9 5 0 8 3 7 9"
            fill="#d69a36" stroke="#b77b2e" stroke-width=".7"/>
      <path d="M1 29h17l-2 12H4Z" fill="#a94720"/>
      <path d="M0 29h19" stroke="#e4b35b" stroke-width="1.4"/>
      <path d="M4 33h11" stroke="#d17a36" stroke-width=".7" opacity=".8"/>
    </g>
  </g>

  <!-- Divider -->
  <path d="M255 46V176" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Wordmark -->
  <text x="434" y="102" text-anchor="middle" fill="#f4dfb4"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="49" font-weight="bold" letter-spacing="-1.4">Bottega</text>

  <path d="M293 130H360M508 130H575" stroke="#d99a37" stroke-width="1.35"/>
  <text x="437" y="141" text-anchor="middle" fill="#e5a83e"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="25" letter-spacing="6">STACK</text>

  <text x="434" y="167" text-anchor="middle" fill="#e9d4a7"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13.2" font-style="italic">A master, a workshop, and a human who signs off.</text>
</svg>
