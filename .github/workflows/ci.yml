name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The same checks on both supported platforms, so one version of every script stays honest
  # on GNU (Linux) and BSD (macOS) tools and macOS's bash 3.2.
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: find . \( -name '*.sh' -o -path './skills/maestro/scripts/bottega' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 bash -n
      - name: Python syntax
        run: python3 -m py_compile scripts/*.py evals/*.py
      - name: Script smoke tests
        run: bash scripts/test-scripts.sh
      - name: Skill content lint
        run: python3 scripts/lint-skills.py
      - name: Eval fixtures selftest (no model calls)
        run: python3 evals/run.py --selftest

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.327
          claude plugin validate . --strict
      - name: ShellCheck (errors only)
        run: find . \( -name '*.sh' -o -path './skills/maestro/scripts/bottega' \) -not -path './node_modules/*' -print0 | xargs -0 shellcheck --severity=error
      - name: Relative markdown links
        run: |
          python3 - <<'PY'
          import os, re, sys
          bad = 0
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "node_modules")]
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  p = os.path.join(root, f)
                  text = open(p, encoding="utf-8").read()
                  text = re.sub(r"```.*?```", "", text, flags=re.S)
                  for m in re.finditer(r"\[[^\]]*\]\(([^)\s]+)", text):
                      t = m.group(1)
                      if t.startswith(("http:", "https:", "mailto:", "#")):
                          continue
                      t = t.split("#")[0]
                      if t and not os.path.exists(os.path.join(root, t)):
                          print(f"{p}: broken link {t}")
                          bad += 1
          sys.exit(1 if bad else 0)
          PY
