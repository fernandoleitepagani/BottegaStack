name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: ./scripts/validate.sh

      - name: Generated command is fresh
        run: ./scripts/gen-command.sh --check

      - name: Validate plugin manifests
        run: |
          set -euo pipefail
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "claude not installed; skipping plugin validate"
          fi
