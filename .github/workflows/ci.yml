name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: ./scripts/validate.sh

      - name: Installer dry run
        run: ./install.sh --target claude --dry-run

      - name: Installer sync check
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$(mktemp -d)"
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com
          export GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          ./install.sh --target claude --yes
          generated="$HOME/.claude/commands/pagani.md"
          test -f "$generated"
          grep -qF 'pagani guard stop' "$generated"
          grep -qF '# PaganiStack Master' "$generated"
          grep -qF 'Step 0' "$generated"
          echo "sync check: PASS"
