name: pagani-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint
        run: |
          if [ -x ./bin/pagani ]; then
            ./bin/pagani lint
          else
            echo "skip: ./bin/pagani is not executable"
          fi

      - name: Check
        run: |
          if [ -x ./scripts/check ]; then
            ./scripts/check
          else
            echo "skip: ./scripts/check is not executable"
          fi
