# shellcheck shell=bash
# Copy this to scripts/verify.conf and fill it in.
# START_CMD runs in the background. $PORT is exported before it runs.
# PORT must come before READY_URL so ${PORT} expands to the configured port.
# PORT=5173
START_CMD='npm run dev -- --port $PORT'
READY_URL="http://localhost:${PORT}"
# READY_TIMEOUT=60
